<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer Neon Party 🎉</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🌴 SUMMER NEON PARTY 🌴</h1>

    <p class="subtitle">
        Uma noite inesquecível está chegando...
    </p>


    <div class="timer">

        <div>
            <span id="days">00</span>
            <small>Dias</small>
        </div>

        <div>
            <span id="hours">00</span>
            <small>Horas</small>
        </div>

        <div>
            <span id="minutes">00</span>
            <small>Minutos</small>
        </div>

        <div>
            <span id="seconds">00</span>
            <small>Segundos</small>
        </div>

    </div>


    <div class="cards">

        <div class="card">
            🍹
            <h2>OPEN BAR</h2>
            <p>Bebidas liberadas durante a festa!</p>
        </div>


        <div class="card">
            🏊
            <h2>PISCINA</h2>
            <p>Prepare seu traje de banho!</p>
        </div>

    </div>


    <a class="maps"
    href="https://www.google.com/maps/place/R.+Cordeiro+Galvão,+382+-+Alto+de+Pinheiros,+São+Paulo+-+SP,+05450-020"
    target="_blank">

    📍 Ver localização no Maps

    </a>


    <footer>
        08/08/2026 • 20h
    </footer>


</div>


<script src="script.js"></script>

</body>
</html>
